name: Build and Deploy to Truehost

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Deploy via SFTP
      run: |
        sudo apt-get update && sudo apt-get install -y lftp
        echo "Deploying to SFTP server 102.212.247.186:1624"
        lftp -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} -p 1624 sftp://102.212.247.186 <<EOF
        set sftp:auto-confirm yes
        set ssl:verify-certificate no
        set net:timeout 60
        set net:max-retries 3
        mirror -R ./dist/ /public_html/
        bye
        EOF
