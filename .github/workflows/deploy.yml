name: Deploy to Truehost

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Install deployment tools
      run: sudo apt-get update && sudo apt-get install -y lftp openssh-client
    
    - name: Test server connectivity
      run: |
        echo "Testing server connectivity..."
        nc -zv das116.truehost.cloud 1624 || echo "Port 1624 not reachable"
        nc -zv das116.truehost.cloud 22 || echo "Port 22 not reachable"
        nc -zv das116.truehost.cloud 21 || echo "Port 21 not reachable"
    
    - name: Explore server directory structure
      run: |
        echo "Exploring server directory structure..."
        
        lftp <<EOF
        set sftp:auto-confirm yes
        set ssl:verify-certificate no
        set net:timeout 30
        set net:max-retries 1
        set net:reconnect-interval-base 5
        set net:reconnect-interval-max 10
        set cmd:parallel 1
        debug 5
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} sftp://das116.truehost.cloud:1624
        pwd
        ls
        ls /
        quit
        EOF
    
    - name: Deploy to public_html (Primary Method)
      run: |
        echo "Attempting deployment to public_html directory..."
        
        lftp <<EOF
        set sftp:auto-confirm yes
        set ssl:verify-certificate no
        set net:timeout 30
        set net:max-retries 1
        set net:reconnect-interval-base 5
        set net:reconnect-interval-max 10
        set cmd:parallel 1
        debug 5
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} sftp://das116.truehost.cloud:1624
        
        # Go to public_html directory directly
        cd public_html
        pwd
        
        # List current contents before sync
        echo "Contents before sync:"
        ls
        
        # Mirror the files to current directory (public_html)
        mirror -R --delete --verbose ./dist/ ./
        
        bye
        EOF
      continue-on-error: true
    
    - name: Verify deployment and clear cache
      run: |
        echo "Verifying deployment and clearing cache..."
        
        lftp <<EOF
        set sftp:auto-confirm yes
        set ssl:verify-certificate no
        set net:timeout 30
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} sftp://das116.truehost.cloud:1624
        
        cd public_html
        pwd
        
        # Create a deployment timestamp file
        echo "Deployed on: $(date)" > deployment-timestamp.txt
        
        # List key files to verify they're updated
        echo "Current directory contents:"
        ls
        echo "Assets directory contents:"
        ls assets/
        echo "Checking index.html:"
        ls index.html
        
        # Show .htaccess contents for cache settings
        echo ".htaccess contents:"
        cat .htaccess || echo "No .htaccess file found"
        
        bye
        EOF
        
        echo "Deployment verification complete!"
        echo "Website should be available at: https://cccknunsconference.org"
        echo "If changes aren't visible, try:"
        echo "1. Hard refresh (Ctrl+F5 or Cmd+Shift+R)"
        echo "2. Clear browser cache"
        echo "3. Try incognito/private browsing"
        echo "4. Check different browsers"
    
    - name: Deploy with basic SFTP (fallback)
      if: failure()
      run: |
        echo "Primary deployment failed, trying basic SFTP..."
        
        lftp <<EOF
        set sftp:auto-confirm yes
        set ssl:verify-certificate no
        set net:timeout 60
        set net:max-retries 2
        set net:reconnect-interval-base 10
        set net:reconnect-interval-max 30
        debug 3
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} sftp://das116.truehost.cloud:1624
        
        # List current directory contents
        pwd
        ls
        
        # Try to sync to current directory (might be the web root)
        mirror -R --delete --verbose ./dist/ ./
        
        bye
        EOF
      continue-on-error: true
    
    - name: Deploy with FTP fallback
      if: failure()
      run: |
        echo "SFTP failed, trying FTP..."
        
        lftp <<EOF
        set ssl:verify-certificate no
        set net:timeout 60
        set net:max-retries 2
        set net:reconnect-interval-base 10
        set net:reconnect-interval-max 30
        debug 3
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ftp://das116.truehost.cloud:21
        
        # List current directory contents
        pwd
        ls
        
        # Try common web root directories
        cd public_html || cd www || cd htdocs || cd web || cd html || echo "Could not find web root"
        pwd
        ls
        
        # Mirror the files
        mirror -R --delete --verbose ./dist/ ./
        
        bye
        EOF
      continue-on-error: true
    
    - name: Alternative FTP deployment
      if: failure()
      run: |
        echo "Trying alternative FTP deployment..."
        
        lftp <<EOF
        set ssl:verify-certificate no
        set net:timeout 60
        set net:max-retries 2
        set net:reconnect-interval-base 10
        set net:reconnect-interval-max 30
        debug 3
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ftp://ftp.cccknunsconference.org:21
        
        # List current directory contents
        pwd
        ls
        
        # Try to find and enter web root
        cd public_html || cd www || cd htdocs || cd web || cd html || echo "Using current directory"
        pwd
        
        # Mirror the files
        mirror -R --delete --verbose ./dist/ ./
        
        bye
        EOF
    
    - name: Deployment status
      if: always()
      run: |
        echo "🎉 Deployment attempt completed!"
        echo ""
        echo "✅ Files should be deployed to: das116.truehost.cloud/public_html"
        echo "🌐 Website URL: https://cccknunsconference.org"
        echo ""
        echo "If changes aren't visible immediately:"
        echo "1. Server caching (wait 5-10 minutes)"
        echo "2. Browser cache (hard refresh: Ctrl+F5)"
        echo "3. CDN cache (if applicable)"
        echo ""
        echo "Contact Truehost support if issues persist."
