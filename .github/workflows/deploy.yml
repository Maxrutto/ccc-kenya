name: Build and Deploy to Truehost

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Verify build output
      run: |
        echo "Build completed. Checking output:"
        ls -la dist/
        echo "Total build size:"
        du -sh dist/

    - name: SFTP Deploy to Truehost
      uses: pressidium/lftp-mirror-action@v1
      with:
        host: 102.212.247.186
        user: ${{ secrets.FTP_USERNAME }}
        pass: ${{ secrets.FTP_PASSWORD }}
        port: 1624
        localDir: './dist/'
        remoteDir: '/public_html/'
        options: '--verbose --only-newer'
