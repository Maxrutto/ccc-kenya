name: Build and Deploy to Truehost

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Verify build output
      run: |
        echo "Build completed. Checking output:"
        ls -la dist/
        echo "Total build size:"
        du -sh dist/

    - name: Install sshpass for password authentication
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Deploy to Truehost via SFTP
      run: |
        echo "Testing connection to Truehost..."
        sshpass -p "${{ secrets.FTP_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 1624 ${{ secrets.FTP_USERNAME }}@102.212.247.186 "pwd && ls -la"
        
        echo "Uploading files via rsync over SSH..."
        sshpass -p "${{ secrets.FTP_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no -p 1624" ./dist/ ${{ secrets.FTP_USERNAME }}@102.212.247.186:/public_html/
        
        echo "Deployment completed!"
