name: FTP Deploy

on:
  push:
    branches:
      - main  # or your default branch

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.0
      with:
        server: ${{ secrets.ftp.cccknunsconference.org }}
        username: ${{ secrets.feiiqhux }}
        password: ${{ secrets.IY-BV2vl+052tu }}
        local-dir: ./   # adjust if your site files are in a subfolder
        server-dir: /public_html/  # adjust if your hosting uses a different folder
