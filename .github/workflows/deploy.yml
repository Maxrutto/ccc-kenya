name: Build and Deploy to Truehost

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Verify build output
      run: |
        echo "Build completed. Checking output:"
        ls -la dist/
        echo "Total build size:"
        du -sh dist/

    - name: FTPS Deploy to Truehost
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: 102.212.247.186
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 1624
        protocol: ftps
        local-dir: ./dist/
        server-dir: /public_html/
        state-name: sync-state.json
        exclude: |
          **/.git*
          **/node_modules/**
          **/.DS_Store
          **/Thumbs.db
        timeout: 60000
        log-level: verbose
