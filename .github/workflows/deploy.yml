name: Build and Deploy to Truehost

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: FTP Deploy to Truehost
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ftp.cccknunsconference.org
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        protocol: ftp
        local-dir: ./dist/
        server-dir: /public_html/
        state-name: sync-state.json
        exclude: |
          **/.git*
          **/node_modules/**
          **/.DS_Store
          **/Thumbs.db
        log-level: verbose
        security: loose
